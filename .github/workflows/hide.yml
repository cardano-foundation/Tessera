name: Hide content

# Records a moderation decision: this website stops showing, or shows again,
# a survey, a response or a governance action's title (backend/ARCHITECTURE.md
# §11, the procedure in backend/server/OPERATIONS.md). The decision takes effect
# at the network's next refresh, within a few minutes.
#
# The repository is public, and so are this workflow's runs. The target never
# reaches a log: it is read from the event payload, masked before anything else
# runs, and the script prints no key. The run name and the case id are public;
# a case id carries no personal data. The `moderation` environment holds the
# database credentials and requires a reviewer, so each decision waits for an
# approver other than whoever started it.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Network whose website the report is about
        type: choice
        options: [preview, preprod]
      action:
        description: Hide, or show again
        type: choice
        options: [hide, unhide]
      target:
        description: The page URL from the report, or survey:/response:/govAction:<key>
        type: string
        required: true
      case:
        description: Case id in the legal team's case system (no personal data)
        type: string
        required: true

run-name: ${{ inputs.action }} on ${{ inputs.network }}, case ${{ inputs.case }}

concurrency:
  group: hide-${{ inputs.network }}
  cancel-in-progress: false

permissions: {}

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: moderation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # One step, so no step's env header shows the target before the mask.
      - name: Record the decision
        working-directory: backend/server
        env:
          NETWORK: ${{ inputs.network }}
          ACTION: ${{ inputs.action }}
          CASE_ID: ${{ inputs.case }}
          TURSO_DATABASE_URL: ${{ vars[format('TURSO_DATABASE_URL_{0}', inputs.network)] }}
          TURSO_AUTH_TOKEN: ${{ secrets[format('TURSO_AUTH_TOKEN_{0}', inputs.network)] }}
        run: |
          target=$(jq -r .inputs.target "$GITHUB_EVENT_PATH")
          echo "::add-mask::$target"
          pnpm exec tsx src/hide.ts "$ACTION" "$target" --case "$CASE_ID"
