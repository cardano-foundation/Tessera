name: Deploy

# A merge to main deploys every network. A `/deploy <testnet>` comment on a PR,
# forks included, deploys its head commit to that testnet with main's version
# of this file. A manual run deploys from the chosen branch with that branch's
# version, which is how a change to this file is tried before merging. Mainnet
# deploys from main only: the target job drops it for anything else, and the
# production environment refuses other branches. Every deploy leaves a
# `deploy/<network>` status on the commit it deployed, so a PR shows it.
#
# Each network migrates its database and deploys its backend before its app,
# so an app never reaches users ahead of the backend it reads.
on:
  push:
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      network:
        description: Network to deploy; mainnet is skipped outside main
        type: choice
        options: [all, preview, preprod]
        default: all

# Runs from one branch or PR go one at a time, and a newer one never cancels an
# upload. Main's runs queue apart from PRs', so a PR never displaces a pending
# deploy of main; a PR deploy and a main deploy can then overlap on a testnet.
# Every comment starts a run, so one that is not a command gets a group of its
# own and cannot displace a pending deploy of its PR.
concurrency:
  group: >-
    deploy-${{ github.event_name != 'issue_comment' && github.ref
    || startsWith(github.event.comment.body, '/deploy') && format('pr-{0}', github.event.issue.number)
    || format('comment-{0}', github.event.comment.id) }}
  cancel-in-progress: false

permissions: {}

jobs:
  target:
    if: >-
      github.event_name != 'issue_comment'
      || github.event.issue.pull_request && startsWith(github.event.comment.body, '/deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      statuses: write
    outputs:
      networks: ${{ steps.target.outputs.networks }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.network }}
          BODY: ${{ github.event.comment.body }}
          ACTOR: ${{ github.event.comment.user.login }}
          PR: ${{ github.event.issue.number }}
        run: |
          # Mainnet still runs on Cloudflare.
          on_vercel=(preview preprod)
          sha=$GITHUB_SHA
          from_main=false
          case "$GITHUB_EVENT_NAME" in
            issue_comment)
              # Anyone can comment on a public repository. `author_association`
              # would not do: MEMBER is any member of the organization.
              access=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
              if [ "$access" != admin ] && [ "$access" != write ]; then
                echo "::error::$ACTOR has $access access to the repository; deploying needs write"
                exit 1
              fi
              wanted=($(head -n1 <<< "$BODY" | tr -d '\r' | sed -nE 's#^/deploy[[:space:]]+([a-z]+)[[:space:]]*$#\1#p'))
              sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid) ;;
            workflow_dispatch)
              if [ "$INPUT" = all ]; then wanted=("${on_vercel[@]}"); else wanted=("$INPUT"); fi
              if [ "$GITHUB_REF" = refs/heads/main ]; then from_main=true; fi ;;
            push)
              wanted=("${on_vercel[@]}")
              from_main=true ;;
          esac
          networks=()
          for net in "${wanted[@]}"; do
            if [ "$net" = mainnet ] && [ "$from_main" != true ]; then continue; fi
            if printf '%s\n' "${on_vercel[@]}" | grep -qx -- "$net"; then networks+=("$net"); fi
          done
          if [ ${#networks[@]} -eq 0 ]; then
            msg="Nothing to deploy for '${wanted[*]}'. On Vercel: ${on_vercel[*]}; mainnet only from main."
            echo "::error::$msg"
            if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$msg"; fi
            exit 1
          fi
          # A status on the deployed commit shows the deploy on that commit's
          # PR, whichever event started it; the report job settles it.
          for net in "${networks[@]}"; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" --silent \
              -f state=pending -f context="deploy/$net" -f description=Deploying \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
          json=$(jq -cn '$ARGS.positional' --args "${networks[@]}")
          echo "$json"
          echo "networks=$json" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ matrix.network == 'mainnet' && 'production' || 'testnets' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        network: ${{ fromJSON(needs.target.outputs.networks) }}
    # Secrets are named statically, matched on the network: a computed name
    # (`secrets[format(…)]`) sends every secret to the runner.
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
    steps:
      # The commit the target job put its status on, even if the branch has
      # moved since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm install --global vercel@64.7.0

      - name: Build backend
        working-directory: backend/server
        env:
          NETWORK: ${{ matrix.network }}
        run: pnpm build:vercel
      - name: Migrate database
        working-directory: backend/server
        env:
          TURSO_DATABASE_URL: ${{ vars[format('TURSO_DATABASE_URL_{0}', matrix.network)] }}
          TURSO_AUTH_TOKEN: ${{ matrix.network == 'preview' && secrets.TURSO_AUTH_TOKEN_PREVIEW || matrix.network == 'preprod' && secrets.TURSO_AUTH_TOKEN_PREPROD || matrix.network == 'mainnet' && secrets.TURSO_AUTH_TOKEN_MAINNET || '' }}
        run: pnpm migrate
      - name: Deploy backend
        working-directory: backend/server
        env:
          VERCEL_PROJECT_ID: ${{ vars[format('VERCEL_PROJECT_ID_BACKEND_{0}', matrix.network)] }}
          VERCEL_TOKEN: ${{ matrix.network == 'preview' && secrets.VERCEL_TOKEN_BACKEND_PREVIEW || matrix.network == 'preprod' && secrets.VERCEL_TOKEN_BACKEND_PREPROD || matrix.network == 'mainnet' && secrets.VERCEL_TOKEN_BACKEND_MAINNET || '' }}
        run: vercel deploy --prebuilt --prod

      - name: Build and deploy app
        working-directory: frontend/app
        env:
          TESSERA_NETWORK: ${{ matrix.network }}
          VERCEL_PROJECT_ID: ${{ vars[format('VERCEL_PROJECT_ID_APP_{0}', matrix.network)] }}
          VERCEL_TOKEN: ${{ matrix.network == 'preview' && secrets.VERCEL_TOKEN_APP_PREVIEW || matrix.network == 'preprod' && secrets.VERCEL_TOKEN_APP_PREPROD || matrix.network == 'mainnet' && secrets.VERCEL_TOKEN_APP_MAINNET || '' }}
        run: |
          vercel pull --yes --environment production
          vercel build --prod
          vercel deploy --prebuilt --prod

  # Apart from the deploy jobs, so the job running the deployed code never
  # holds a token that can write statuses.
  report:
    needs: [target, deploy]
    if: always() && needs.target.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.target.outputs.sha }}
          NETWORKS: ${{ needs.target.outputs.networks }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")
          for net in $(jq -r '.[]' <<< "$NETWORKS"); do
            conclusion=$(jq -r --arg name "deploy ($net)" '.jobs[] | select(.name == $name) | .conclusion' <<< "$jobs")
            case "$conclusion" in
              success) state=success description=Deployed ;;
              failure) state=failure description="Deploy failed" ;;
              *) state=error description="Deploy ${conclusion:-did not run}" ;;
            esac
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" --silent \
              -f state="$state" -f context="deploy/$net" \
              -f description="$description" -f target_url="$run"
          done
